<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Netlify form definitions</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!--
      This page is never shown to anyone. It exists ONLY so Netlify's build-time
      form detection can find a real HTML form and register it.

      Netlify scans static HTML at deploy time; it cannot see a React form that
      only exists after JavaScript runs, so an App Router page can't be detected
      on its own. The support page therefore POSTs here (urlencoded, with
      form-name=support) and Netlify records the submission against this form.

      IMPORTANT: every field on /support must have a matching input below, with
      the SAME name. A field missing here is silently dropped from submissions.
      Type/required/order don't matter to Netlify — only the names.
    -->
    <form name="support" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="support" />
      <!-- Honeypot: real people never see it, bots fill it, Netlify bins those. -->
      <input name="bot-field" />

      <!-- Typed by the tester -->
      <select name="kind"></select>
      <textarea name="what"></textarea>
      <textarea name="expected"></textarea>
      <textarea name="promo"></textarea>
      <input type="email" name="email" />

      <!-- Auto-attached by the page, so the tester never types them.
           `tester` is the access LABEL (user1), never the access code —
           the code unlocks an API key and must not sit in form storage. -->
      <input name="tester" />
      <input name="env" />
      <input name="when" />
      <input name="build" />
    </form>

    <!--
      Approval outcomes (app/components/ApprovalOutcomes.tsx, lib/outcomeLog.ts).
      One submission per piece of copy, sent when the tester reports what their
      approver did. Same rule as above: every field name must match exactly.
      Never includes the marketing copy. `feedback` is only what the tester
      chooses to paste, under a label that says it is sent.
    -->
    <!--
      Free-trial sign-ups (lib/freeTrial.ts, app/app/page.tsx). One submission
      the first time a visitor starts their five free checks, so every trial is
      a lead you can follow up. Never includes the copy they check.
    -->
    <form name="trial" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="trial" />
      <input name="bot-field" />

      <input type="email" name="email" />
      <input name="firm" />
      <input name="marketing" />
      <input name="when" />
      <input name="build" />
    </form>

    <form name="outcome" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="outcome" />
      <input name="bot-field" />

      <input name="tester" />
      <input name="session" />
      <input name="outcome" />
      <input name="rounds" />
      <input name="reached_clean" />
      <input name="rounds_to_clean" />
      <textarea name="feedback"></textarea>
      <input name="first_checked" />
      <input name="answered_at" />
      <input name="build" />
    </form>
  </body>
</html>
